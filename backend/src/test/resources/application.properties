spring.application.name=backend-test
spring.profiles.active=test
server.port=0

api.security.token.secret=test-secret-not-for-production
cors.allowed-origins=http://localhost:5173
auth.cookie.name=gym_auth
auth.cookie.secure=false
auth.cookie.same-site=Lax
auth.cookie.max-age-seconds=7200
csrf.cookie.secure=false
csrf.cookie.same-site=Lax

spring.datasource.url=jdbc:tc:postgresql:15-alpine:///gym_test?TC_INITSCRIPT=sql/database/db_0.0.1.sql
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
